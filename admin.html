<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173f35">
  <title>Venue Login · Ansar Campus</title><link rel="icon" href="images/map.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin><link rel="stylesheet" href="style.css">
</head>
<body class="admin-page">
  <div id="login-view" class="login-shell"><section class="login-card"><span class="brand-mark large">A</span><h1>Venue login</h1><p>Login with your Google account. The venue editor opens only for <strong>ansarmedia@ansarschool.in</strong>.</p><button id="login-button" class="primary-button" type="button">Login with Google</button><p id="login-message" class="form-message" role="alert"></p><a href="index.html">← Return to public map</a></section></div>
  <div id="admin-view" class="admin-shell" hidden>
    <aside class="admin-panel">
      <div class="admin-header"><div><strong>Venue editor</strong><small id="signed-in-email"></small></div><button id="logout-button" class="text-button" type="button">Sign out</button></div>
      <p class="helper">Click the map to place a new venue, or select an existing marker to edit it.</p>
      <form id="venue-form"><input id="venue-id" type="hidden">
        <label>Name <input id="venue-name" required maxlength="80" placeholder="e.g. Main Stage"></label><label>Description <textarea id="venue-description" maxlength="240" rows="3" placeholder="Programme or directions"></textarea></label>
        <div class="form-row"><label>Category <select id="venue-category"><option value="stage">Stage</option><option value="venue">Venue</option><option value="food">Food</option><option value="facility">Facility</option><option value="medical">Medical</option><option value="other">Other</option></select></label><label>Floor <input id="venue-floor" maxlength="40" placeholder="Ground"></label></div>
        <div class="form-row coordinates"><label>Latitude <input id="venue-lat" required type="number" step="any"></label><label>Longitude <input id="venue-lng" required type="number" step="any"></label></div>
        <label class="check-row"><input id="venue-active" type="checkbox" checked> Visible on public map</label>
        <div class="form-actions"><button class="primary-button" type="submit">Save venue</button><button id="new-button" class="secondary-button" type="button">New</button><button id="delete-button" class="danger-button" type="button" hidden>Delete</button></div><p id="form-message" class="form-message" role="status" aria-live="polite"></p>
      </form><div class="venue-list-heading"><strong>All venues</strong><span id="venue-count"></span></div><div id="venue-list" class="venue-list"></div>
    </aside><main id="admin-map" aria-label="Venue editing map"></main>
  </div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9coqIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin></script><script src="firebase-config.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="admin.js"></script>
</body></html>
